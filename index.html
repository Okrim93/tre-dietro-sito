<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tre Dietro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
<style>
:root{--bg:#F3F4F7;--surface:#fff;--line:#D9DCE5;--ctl:#858B9B;--ink:#12141B;--ink2:#3C4150;--muted:#5F6576;--accent:#1D3C8F;--bad:#B3261E;--pitch:#2C7A57;--pitch2:#27704F}
@media (prefers-color-scheme:dark){:root{--bg:#0F1116;--surface:#171A21;--line:#2C313C;--ctl:#6F7686;--ink:#ECEEF3;--ink2:#B9BECB;--muted:#8A90A0;--accent:#8FB0FF;--bad:#F27B7B}}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:400 16px/1.5 Archivo,system-ui,sans-serif}
main{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:26px 24px 22px}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:16px;border-bottom:3px solid var(--ink)}
.mark{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;background:repeating-linear-gradient(0deg,var(--pitch) 0 25%,var(--pitch2) 25% 50%)}
.mark svg{width:24px;height:24px;display:block}
h1{margin:0;font-size:26px;font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:.03em;line-height:1}
p{margin:0 0 16px;color:var(--ink2);font-size:15px}
label{display:block;font-size:11.5px;font-weight:600;font-stretch:80%;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input[type=password]{width:100%;min-height:44px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--ctl);border-radius:6px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:14.5px;font-weight:400;font-stretch:100%;letter-spacing:0;text-transform:none;color:var(--ink2);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
button{width:100%;min-height:44px;border:1px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--bg);font:700 14px Archivo,sans-serif;font-stretch:78%;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:transform .12s cubic-bezier(.23,1,.32,1)}
button:active:not(:disabled){transform:scale(.97)} button:disabled{opacity:.55;cursor:default}
#e{min-height:1.4em;margin:12px 0 0;font-size:14.5px;color:var(--bad)}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6.5h18" stroke="rgba(255,255,255,.75)" stroke-width="1.4" fill="none"/><circle cx="5.5" cy="14.5" r="2.7" fill="#fff"/><circle cx="12" cy="17" r="2.7" fill="#fff"/><circle cx="18.5" cy="14.5" r="2.7" fill="#fff"/></svg></span><h1>Tre Dietro</h1></div>
  <p>Accesso riservato. Scrivi la chiave per entrare.</p>
  <form id="f" autocomplete="off">
    <label for="k">Chiave d’accesso</label>
    <input id="k" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" enterkeyhint="go" required>
    <label class="chk"><input type="checkbox" id="r" checked> Ricorda questo dispositivo</label>
    <button type="submit" id="b">Entra</button>
    <p id="e" role="alert"></p>
  </form>
</main>
